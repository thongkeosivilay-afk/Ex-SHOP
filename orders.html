<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<script>try{var t=localStorage.getItem("theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}</script>
<meta name="theme-color" content="#000000">
<title>ປະຫວັດການສັ່ງຊື້</title>

<script>if(!exLoggedIn())exNeedLogin('orders.html');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+Lao+Looped:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="orders.css">
<script src="theme.js"></script>
<script src="font.js"></script>
</head>
<body class="oh-page">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="o-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="o-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></symbol>
<symbol id="o-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="o-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="o-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="o-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
<symbol id="o-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></symbol>
<symbol id="o-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
<symbol id="o-dl" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
</defs>
</svg>

<header class="oh-top">
  <a class="oh-back" id="ohBack" href="index.html" aria-label="ກັບຄືນ"><svg class="i"><use href="#o-back"/></svg></a>
  <h1>ປະຫວັດການສັ່ງຊື້</h1>
</header>

<main class="oh-sheet">
  <section class="oh-head">
    <div class="oh-ico" aria-hidden="true"><svg class="i"><use href="#o-history"/></svg></div>
    <div class="oh-ht">
      <h2>ປະຫວັດການສັ່ງຊື້</h2>
      <p>ກວດສອບປະຫວັດລາຍການ ຄີ ແລະລາຍລະອຽດການໃຊ້ງານທັງໝົດຂອງທ່ານ</p>
    </div>
  </section>

  <label class="oh-search" for="ohQ">
    <svg class="i"><use href="#o-search"/></svg>
    <input id="ohQ" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="ຄົ້ນຫາຊື່ສິນຄ້າ ຫຼື ຕົວເລືອກ...">
    <button class="oh-clr" id="ohClr" type="button" aria-label="ລ້າງຄຳຄົ້ນຫາ" hidden><svg class="i"><use href="#o-x"/></svg></button>
  </label>

  <div class="oh-count" id="ohCount" aria-live="polite"></div>
  <section class="oh-list" id="ohList" aria-live="polite"></section>
</main>

<div class="oh-toast" id="ohToast" role="status" aria-live="polite"><svg class="i"><use href="#o-check"/></svg><span></span></div>

<script src="exlog.js"></script>
<script src="orders.js"></script>
<script src="notify.js"></script>
</body>
</html>
