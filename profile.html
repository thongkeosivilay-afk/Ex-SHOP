<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<script>try{var t=localStorage.getItem("theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="light"}</script>
<title>ໂປຣໄຟລ໌</title>
<script src="guard.js"></script>
<script>if(!exLoggedIn())exNeedLogin('profile.html');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+Lao+Looped:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="profile.css">
</head>
<body class="pf-page">

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="p-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="p-wallet" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></symbol>
<symbol id="p-bag" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></symbol>
<symbol id="p-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
<symbol id="p-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
<symbol id="p-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="p-eye-off" viewBox="0 0 24 24"><path d="M10.7 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-2.2 3.2M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6M14.1 14.1a3 3 0 0 1-4.2-4.2M2 2l20 20"/></symbol>
<symbol id="p-out" viewBox="0 0 24 24"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></symbol>
<symbol id="p-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="p-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></symbol>
<symbol id="p-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></symbol>
<symbol id="p-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
<symbol id="p-mail" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></symbol>
<symbol id="p-cal" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
<symbol id="p-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
</defs>
</svg>

<header class="pf-top">
  <a class="pf-back" id="pfBack" href="index.html" aria-label="ກັບຄືນ"><svg class="i"><use href="#p-back"/></svg></a>
  <h1>ໂປຣໄຟລ໌</h1>
</header>

<main class="pf-sheet" id="pfApp">

  <!-- ข้อมูลบัญชี -->
  <section class="pf-card pf-me">
    <div class="pf-av" id="pfAv" aria-hidden="true">?</div>
    <div class="pf-id">
      <h2 id="pfName">…</h2>
      <p class="pf-on"><i aria-hidden="true"></i>ກຳລັງອອນລາຍ</p>
      <div class="pf-meta" id="pfMeta"></div>
    </div>
  </section>

  <!-- เวลาใช้งานแบบสด -->
  <section class="pf-card pf-live" aria-label="ເວລາໃຊ້ງານ">
    <div class="pf-lh"><svg class="i"><use href="#p-clock"/></svg>ເວລາທີ່ໃຊ້ງານຕັ້ງແຕ່ເຂົ້າສູ່ລະບົບ</div>
    <div class="pf-timer" id="pfTimer" role="timer" aria-live="off">00:00:00</div>
    <div class="pf-since" id="pfSince"></div>
  </section>

  <!-- ยอดเงิน -->
  <section class="pf-card pf-bal">
    <div>
      <span class="pf-k">ຍອດເງິນຄົງເຫຼືອ</span>
      <b class="pf-bv" id="pfBal">₭0</b>
    </div>
    <a class="pf-btn pf-btn-red" href="topup.html"><svg class="i"><use href="#p-plus"/></svg>ເຕີມເງິນ</a>
  </section>

  <!-- สถิติ -->
  <h3 class="pf-h">ສະຖິຕິຂອງຂ້ອຍ</h3>
  <section class="pf-grid" aria-label="ສະຖິຕິ">
    <div class="pf-stat"><div class="pf-si"><svg class="i"><use href="#p-wallet"/></svg></div><span class="pf-k">ຍອດເຕີມທັງໝົດ</span><b id="stTopAll">₭0</b><small id="stTopAllN"></small></div>
    <div class="pf-stat"><div class="pf-si"><svg class="i"><use href="#p-wallet"/></svg></div><span class="pf-k">ຍອດເຕີມ 7 ວັນ</span><b id="stTop7">₭0</b><small id="stTop7N"></small></div>
    <div class="pf-stat"><div class="pf-si"><svg class="i"><use href="#p-bag"/></svg></div><span class="pf-k">ສິນຄ້າທີ່ຊື້ທັງໝົດ</span><b id="stBuyAll">0</b><small id="stBuyAllN"></small></div>
    <div class="pf-stat"><div class="pf-si"><svg class="i"><use href="#p-bag"/></svg></div><span class="pf-k">ສິນຄ້າທີ່ຊື້ 7 ວັນ</span><b id="stBuy7">0</b><small id="stBuy7N"></small></div>
  </section>

  <!-- ประวัติล่าสุด -->
  <h3 class="pf-h">ກິດຈະກຳຫຼ້າສຸດ</h3>
  <section class="pf-card pf-hist" id="pfHist" aria-live="polite"></section>

  <!-- เปลี่ยนรหัสผ่าน -->
  <h3 class="pf-h">ຄວາມປອດໄພ</h3>
  <section class="pf-card">
    <div class="pf-lh"><svg class="i"><use href="#p-lock"/></svg>ປ່ຽນລະຫັດຜ່ານ</div>
    <form id="pwForm" novalidate autocomplete="off">
      <input type="text" name="username" autocomplete="username" hidden tabindex="-1" aria-hidden="true">
      <div class="pf-f"><label for="pwOld">ລະຫັດຜ່ານເກົ່າ</label>
        <div class="pf-in"><svg class="i"><use href="#p-lock"/></svg><input id="pwOld" type="password" autocomplete="current-password" placeholder="ລະຫັດຜ່ານເກົ່າ"><button class="pf-eye" type="button" aria-label="ສະແດງລະຫັດຜ່ານ" aria-pressed="false"><svg class="i"><use href="#p-eye"/></svg></button></div><p class="pf-e" id="pwOldE"></p></div>
      <div class="pf-f"><label for="pwNew">ລະຫັດຜ່ານໃໝ່</label>
        <div class="pf-in"><svg class="i"><use href="#p-lock"/></svg><input id="pwNew" type="password" autocomplete="new-password" placeholder="ຢ່າງໜ້ອຍ 6 ຕົວອັກສອນ"><button class="pf-eye" type="button" aria-label="ສະແດງລະຫັດຜ່ານ" aria-pressed="false"><svg class="i"><use href="#p-eye"/></svg></button></div>
        <div class="pf-str" id="pwStr" data-l="0" aria-hidden="true"><i></i><i></i><i></i><i></i><em id="pwStrT"></em></div>
        <p class="pf-e" id="pwNewE"></p></div>
      <div class="pf-f"><label for="pwNew2">ຢືນຢັນລະຫັດຜ່ານໃໝ່</label>
        <div class="pf-in"><svg class="i"><use href="#p-lock"/></svg><input id="pwNew2" type="password" autocomplete="new-password" placeholder="ຢືນຢັນລະຫັດຜ່ານໃໝ່"><button class="pf-eye" type="button" aria-label="ສະແດງລະຫັດຜ່ານ" aria-pressed="false"><svg class="i"><use href="#p-eye"/></svg></button></div><p class="pf-e" id="pwNew2E"></p></div>
      <p class="pf-hint">ເມື່ອປ່ຽນສຳເລັດ ອຸປະກອນອື່ນທີ່ເຂົ້າສູ່ລະບົບຢູ່ຈະຖືກອອກຈາກລະບົບ</p>
      <button class="pf-btn pf-btn-red pf-block" id="pwGo" type="submit"><span class="lb">ບັນທຶກລະຫັດຜ່ານໃໝ່</span><span class="sp" aria-hidden="true"></span></button>
    </form>
  </section>

  <button class="pf-btn pf-out pf-block" id="pfOut" type="button"><svg class="i"><use href="#p-out"/></svg>ອອກຈາກລະບົບ</button>
</main>

<div class="pf-toast" id="pfToast" role="status" aria-live="polite"><svg class="i"><use href="#p-check"/></svg><span></span></div>

<script src="exlog.js"></script>
<script src="profile.js"></script>
</body>
</html>
