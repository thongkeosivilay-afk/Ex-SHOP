<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>ເຕີມເງິນ</title>
<script src="guard.js"></script>
<script>if(!exLoggedIn())exNeedLogin('topup.html');</script>
<script src="exlog.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+Lao+Looped:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e8372a; --red2:#ff4a3a; --bg:#000; --card:#040404; --line:#1a1a1a;
  --txt:#fff; --mut:#8c8c8c; --mut2:#6b6b6b;
  --f:'Outfit','Noto Sans Lao Looped',system-ui,sans-serif;
  --fl:'Noto Sans Lao Looped','Outfit',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:var(--txt);font-family:var(--fl);min-height:100%}
body{padding:0 clamp(18px,7vw,48px) 40px;padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding-top:22px}

/* ---------- views + blur transition ---------- */
.view{transition:filter .5s ease,opacity .5s ease,transform .5s ease}
.view.hide{display:none}
.view.blur-out{filter:blur(16px);opacity:0;transform:scale(.97);pointer-events:none}
.view.blur-in{filter:blur(16px);opacity:0;transform:scale(1.03)}

/* ---------- back link + balance ---------- */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--mut2);font-size:12.5px;margin-bottom:10px;text-decoration:none}
.back svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bal{font-family:var(--f);font-weight:900;font-size:34px;line-height:1.15;color:var(--red);letter-spacing:.5px;
  text-shadow:0 0 22px rgba(232,55,42,.55),0 0 4px rgba(232,55,42,.4)}
.sub{margin-top:6px;color:var(--mut);font-size:14.5px;font-weight:300}

/* ---------- bank picker (ปุ่ม → ขยายเป็นการ์ด) ---------- */
.bwrap{position:relative;height:62px;margin:16px 0 6px;z-index:30}
.bdim{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .35s ease}
.bdim.show{opacity:1;pointer-events:auto}
.bsel{position:absolute;top:0;left:0;right:0;height:62px;z-index:30;overflow:hidden;border-radius:18px;
  background:#0a0a0a;border:1px solid #232323;
  transition:height .5s cubic-bezier(.22,1,.36,1),border-color .35s,box-shadow .35s,background .35s,border-radius .5s cubic-bezier(.22,1,.36,1);
  will-change:height;transform:translateZ(0)}
.bsel.open{background:#060606;border-color:#6d211b;border-radius:22px;
  box-shadow:0 18px 50px rgba(0,0,0,.75),0 0 34px rgba(232,55,42,.22)}
.bhead{width:100%;height:60px;display:flex;align-items:center;gap:12px;padding:0 14px 0 11px;text-align:left}
.bhead .bt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bhead .bt small{font:400 11px/1 var(--fl);color:var(--mut2)}
.bhead .bt b{font:700 15.5px/1.15 var(--f);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhead .chev{width:30px;height:30px;border-radius:50%;background:#141414;display:flex;align-items:center;justify-content:center;
  transition:transform .5s cubic-bezier(.22,1,.36,1),background .3s}
.bhead .chev svg{width:15px;height:15px;stroke:#bbb;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.bsel.open .chev{transform:rotate(180deg);background:#2a0e0b}
.bsel.open .chev svg{stroke:var(--red2)}
.bl{position:relative;flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--c,#333);color:#fff;
  display:flex;align-items:center;justify-content:center;font:800 12.5px/1 var(--f);letter-spacing:.2px;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 12px rgba(0,0,0,.45)}
.bl img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:4px;display:none}
.bl.has img{display:block}
.bpanel{opacity:0;transform:translateY(-6px);transition:opacity .3s ease,transform .45s cubic-bezier(.22,1,.36,1)}
.bsel.open .bpanel{opacity:1;transform:none;transition-delay:.08s}
.bttl{padding:2px 16px 8px;font:600 11.5px/1 var(--fl);color:var(--mut2);border-top:1px solid #1a1a1a;padding-top:11px}
.blist{max-height:272px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 8px 8px;scrollbar-width:none}
.blist::-webkit-scrollbar{display:none}
.bit{width:100%;display:flex;align-items:center;gap:12px;height:56px;padding:0 8px;border-radius:14px;text-align:left;
  opacity:0;transform:translateY(10px);transition:opacity .35s ease,transform .45s cubic-bezier(.22,1,.36,1),background .2s}
.bsel.open .bit{opacity:1;transform:none;transition-delay:calc(.07s + var(--i,0)*.025s),calc(.07s + var(--i,0)*.025s),0s}
.bit:active{background:#120807}
.bit .bn{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bit .bn b{font:700 14px/1.1 var(--f);color:#eee}
.bit .bn span{font:300 11.5px/1.25 var(--fl);color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bit .ck{flex:0 0 22px;height:22px;border-radius:50%;border:1.5px solid #2a2a2a;display:flex;align-items:center;justify-content:center;transition:.25s}
.bit .ck svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:.3s cubic-bezier(.2,1.4,.4,1)}
.bit.sel{background:#150605}
.bit.sel .bn b{color:#fff}
.bit.sel .ck{background:var(--red);border-color:var(--red);box-shadow:0 0 12px rgba(232,55,42,.55)}
.bit.sel .ck svg{opacity:1;transform:none}
.bit.off{opacity:.38!important;filter:grayscale(.7)}
.bit.off .ck{display:none}
.bit .soon{font:600 10.5px/1 var(--fl);color:var(--mut2);border:1px solid #262626;border-radius:99px;padding:5px 8px}

.mtd{display:flex;align-items:center;gap:12px;margin:16px 0 6px;padding:10px 14px 10px 11px;border-radius:18px;background:#0a0a0a;border:1px solid #232323}
.mtd .mt{display:flex;flex-direction:column;gap:4px}
.mtd .mt small{font:400 11px/1 var(--fl);color:var(--mut2)}
.mtd .mt b{font:700 15.5px/1.15 var(--f);color:#fff}

/* ---------- main card ---------- */
.card{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 20px 22px}
.card h2{font:700 20px/1.3 var(--f);color:#fff}
.card .s{margin-top:3px;color:var(--mut2);font-size:13.5px;font-weight:300;line-height:1.5}
.lbl{display:block;margin-top:22px;font:700 13px/1 var(--fl);color:#d4d4d4}
.inp{margin-top:10px;width:100%;height:53px;border-radius:14px;background:#000;border:1px solid #202020;
  color:#fff;font:600 18px var(--f);padding:0 15px;outline:0;transition:.2s}
.inp:focus{border-color:#5a1c17;box-shadow:0 0 0 3px rgba(232,55,42,.12)}
.chips{display:flex;gap:6px;margin-top:14px;flex-wrap:nowrap}
.chip{flex:1 1 auto;min-width:0;white-space:nowrap;height:31px;padding:0 4px;border-radius:9px;background:#040404;border:1px solid #1c1c1c;
  color:var(--red);font:700 13.5px/1 var(--f);transition:.15s}
.chip.on{color:#fff;background:#190605;border-color:#7a1f1a}
.go{margin-top:18px;width:100%;height:49px;border-radius:12px;background:linear-gradient(180deg,#ee3d2f,#e3352a);color:#fff;
  font:700 16px var(--fl);display:flex;align-items:center;justify-content:center;gap:9px;
  box-shadow:0 8px 30px rgba(232,55,42,.38),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .12s}
.go:active{transform:scale(.985)}
.go svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hint{margin-top:14px;text-align:center;color:var(--mut2);font-size:12px;font-weight:300;padding-bottom:12px;border-bottom:1px solid var(--line)}
.how{margin-top:20px;font:700 16px/1.3 var(--f);color:#fff}
.steps{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:11px}
.steps li{display:flex;gap:11px;align-items:flex-start;color:#9a9a9a;font-size:14px;font-weight:300;line-height:1.5}
.steps i{flex:0 0 18px;height:18px;border-radius:50%;background:var(--red);color:#fff;font:700 11px/18px var(--f);
  text-align:center;font-style:normal;margin-top:2px;box-shadow:0 0 10px rgba(232,55,42,.35)}
.foot{margin:26px -10px 0;border-top:1px solid #111}

/* ---------- QR view ---------- */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qback{display:inline-flex;align-items:center;gap:4px;color:var(--mut);font-size:13px}
.qback svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.qamt{margin-top:14px;font:900 30px/1.1 var(--f);color:var(--red);text-shadow:0 0 20px rgba(232,55,42,.5)}
.qbank{margin-top:4px;color:var(--mut);font-size:13.5px;font-weight:300}
.qcard{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;align-items:center}
.ring{position:relative;width:236px;height:236px}
.ring svg.r{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ring .tr{stroke:#1a1a1a}
.ring .pg{stroke:var(--red);stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(232,55,42,.8));transition:stroke-dashoffset .1s linear,opacity .2s}
.ring.low .pg{stroke:#ff5a4a;animation:pls .8s ease-in-out infinite}
@keyframes pls{50%{filter:drop-shadow(0 0 11px rgba(255,90,74,1))}}
.qrbox{position:absolute;inset:13px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.qrbox img{width:100%;height:100%;object-fit:contain;display:block}
.qrph{display:flex;flex-direction:column;align-items:center;gap:6px;color:#444;font-size:11.5px;text-align:center;padding:10px}
.qrph svg{width:70px;height:70px}
.cd{margin-top:14px;color:var(--mut);font-size:13px;font-weight:300}
.cd b{font:800 15px var(--f);color:#fff}
.cd.low b{color:var(--red2)}
.info{width:100%;margin-top:16px;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:11px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px}
.row span{color:var(--mut2);font-weight:300}
.row b{font:600 14px var(--f);color:#e8e8e8;text-align:right;word-break:break-all}
.cp{margin-left:8px;height:24px;padding:0 10px;border-radius:7px;background:#120606;border:1px solid #3a1511;color:var(--red);font:700 11.5px var(--fl)}
.slip{margin-top:16px;width:100%;min-height:92px;border:1.5px dashed #3a1511;border-radius:16px;background:#070303;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#b9b9b9;font-size:13.5px;
  cursor:pointer;position:relative;overflow:hidden;transition:.2s;text-align:center;padding:14px}
.slip:active{border-color:var(--red)}
.slip svg{width:26px;height:26px;fill:none;stroke:var(--red);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.slip small{color:var(--mut2);font-size:11.5px;font-weight:300}
.slip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.slip input{display:none}

/* ---------- modal cards ---------- */
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:22px;
  background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ov.show{display:flex}
.pop{width:100%;max-width:340px;background:#070707;border:1px solid #241512;border-radius:24px;padding:26px 22px 22px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.7),0 0 40px rgba(232,55,42,.12);animation:pop .45s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.88)}to{opacity:1;transform:none}}
.spin{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;border:5px solid #1c1c1c;border-top-color:var(--red);
  animation:sp 1s linear infinite;filter:drop-shadow(0 0 8px rgba(232,55,42,.5))}
@keyframes sp{to{transform:rotate(360deg)}}
.pop h3{font:700 18px/1.4 var(--fl);color:#fff}
.pop p{margin-top:6px;color:var(--mut);font-size:13px;font-weight:300;line-height:1.55}
.big{margin:14px 0 4px;font:900 40px/1 var(--f);color:var(--red);letter-spacing:1px;text-shadow:0 0 22px rgba(232,55,42,.55)}
.bar{height:5px;border-radius:9px;background:#181818;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:100%;background:var(--red);border-radius:9px;box-shadow:0 0 10px rgba(232,55,42,.7);transition:width 1s linear}
.sum{margin-top:14px;font-size:12.5px;color:var(--mut2)}
.sum b{color:#ddd;font-weight:600}
.link{display:block;margin:14px auto 0;color:var(--mut);font-size:12.5px;text-decoration:underline}
.ok{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 30px rgba(232,55,42,.6)}
.ok svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}

/* contact card = bottom sheet */
.ct{position:fixed;left:0;right:0;bottom:0;z-index:60;display:none;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ct.show{display:block}
.ct .pop{max-width:520px;margin:0 auto;text-align:left;animation:up .5s cubic-bezier(.2,1.2,.4,1) both;border-radius:22px}
@keyframes up{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
.ct h3{font-size:16px}
.ct .x{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:50%;background:#141414;color:#aaa;font-size:15px}
.ct .pop{position:relative}
.ctl{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.ctl a{display:flex;align-items:center;gap:12px;height:48px;padding:0 14px;border-radius:13px;background:#0b0b0b;border:1px solid #1f1f1f;
  color:#fff;text-decoration:none;font:600 14px var(--fl)}
.ctl a em{font-style:normal;margin-left:auto;color:var(--mut2);font-size:12px;font-weight:300}
.ctl a .d{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font:800 13px var(--f);color:#fff}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:90;
  background:#140807;border:1px solid #3a1511;color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;transition:.35s;pointer-events:none;
  box-shadow:0 8px 30px rgba(0,0,0,.6);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
<script src="theme.js"></script>
<script src="font.js"></script>
<link rel="stylesheet" href="transition.css">
<script src="transition.js"></script>
</head>
<body>
<div class="wrap">

<!-- ===================== หน้าเลือกจำนวนเงิน ===================== -->
<section class="view" id="vPick">
  <a class="back" href="index.html"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>ກັບໜ້າຫຼັກ</a>
  <div class="bal" id="bal">₭0</div>
  <p class="sub">ເຕີມເງິນຜ່ານ QR ເງິນເຂົ້າອັດຕະໂນມັດ</p>

  <div class="mtd"><span class="bl" style="--c:#d71920">QR</span><span class="mt"><small>ຊ່ອງທາງຊຳລະ</small><b>LAOQR</b></span></div>

  <div class="card">
    <h2>ເຕີມເງິນດ້ວຍ LAOQR</h2>
    <p class="s">ສະແກນຈ່າຍ ແລ້ວຍອດເງິນເຂົ້າທັນທີ</p>

    <label class="lbl" for="amt">ຈຳນວນເງິນ (ກີບ)</label>
    <input class="inp" id="amt" type="text" inputmode="numeric" autocomplete="off" value="100,000">
    <div class="chips" id="chips"></div>

    <button class="go" id="goBtn" type="button">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><path d="M14 14h3v3m4-3v.01M14 21h.01M17 21h4v-4"/></svg>
      ສ້າງ QR Code
    </button>
    <p class="hint" id="hint"></p>

    <h3 class="how">ວິທີເຕີມເງິນ</h3>
    <ul class="steps" id="steps"></ul>
  </div>
  <div class="foot"></div>
</section>

<!-- ===================== หน้า QR + แนบสลิป ===================== -->
<section class="view hide" id="vQR">
  <div class="qtop">
    <button class="qback" id="qBack" type="button"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>ກັບຄືນ</button>
  </div>
  <div class="qamt" id="qAmt">₭0</div>
  <p class="qbank" id="qBank">ສະແກນ QR ດ້ວຍແອັບທະນາຄານ ແລ້ວໂອນຕາມຍອດທີ່ສະແດງ</p>

  <div class="qcard">
    <div class="ring">
      <svg class="r" viewBox="0 0 240 240"><path class="tr" d="M120 3H211A26 26 0 0 1 237 29V211A26 26 0 0 1 211 237H29A26 26 0 0 1 3 211V29A26 26 0 0 1 29 3Z" fill="none" stroke-width="4"/>
        <path class="pg" id="pg" d="M120 3H211A26 26 0 0 1 237 29V211A26 26 0 0 1 211 237H29A26 26 0 0 1 3 211V29A26 26 0 0 1 29 3Z" fill="none" stroke-width="4" pathLength="1"/></svg>
      <div class="qrbox" id="qrbox"></div>
    </div>
    <p class="cd" id="cd"><span id="cdLbl">ເຫຼືອເວລາ</span> <b id="cdn">05:00</b></p>

    <div class="info">
      <div class="row"><span>ຊ່ອງທາງ</span><b>LAOQR</b></div>
      <div class="row"><span>ຈຳນວນເງິນ</span><b id="iAmt"></b></div>
      <div class="row"><span>ສະຖານະ</span><b>ລໍຖ້າການໂອນ...</b></div>
    </div>

  </div>
</section>

</div>

<!-- การ์ดผลลัพธ์ -->
<div class="ov" id="ovWait">
  <div class="pop" id="waitCard"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   เติมเงินผ่าน LAOQR — สร้าง QR / ตรวจสถานะ ทำผ่าน Edge Function "jvix-pay" (คีย์ API อยู่ฝั่งเซิร์ฟเวอร์เท่านั้น)
   ===================================================================== */
const CONFIG = {
  minAmount: 1000,
  maxAmount: 50000000,
  amounts: [10000, 50000, 100000, 200000, 500000, 1000000],
  pollMs: 3000,          // โพลเช็กสถานะทุก 3 วินาที
  qrSeconds: 300,        // ค่าสำรอง ถ้า Jvix ไม่ส่ง expires_at มา (ปกติใช้เวลาหมดอายุจริงจาก Jvix)
  graceSeconds: 90,      // เกินเวลาแล้วโพลต่ออีกช่วงหนึ่ง เผื่อเพิ่งโอน
  contacts: [
    { name:'Discord',  hint:'ແອດມິນ', short:'D', color:'#5865F2', url:'' },
    { name:'Facebook', hint:'ແອດມິນ', short:'f', color:'#1877F2', url:'' },
    { name:'WhatsApp', hint:'ແອດມິນ', short:'W', color:'#25D366', url:'' }
  ]
};
const PAY_URL = EX_SB.url + '/functions/v1/jvix-pay';

const $ = s => document.querySelector(s);
const fmt = n => '₭' + Number(n).toLocaleString('en-US');
const short = n => n >= 1000000 ? (n/1000000)+'M' : (n/1000)+'k';
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const PEND = 'exshop_topup_pending';

let amount = 100000, balance = store.get('exshop_balance', 0);
let cur = null, tickT = null, pollT = null, busy = false, polling = false, toastT;

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2800); }
function setBal(){ $('#bal').textContent = fmt(balance); }
function saveBal(n){ balance = Number(n) || 0; store.set('exshop_balance', balance); setBal(); }
function syncBal(){ try{ exRpc('member_me',{p_token:exToken()}).then(j=>{ if(j && j.ok) saveBal(j.balance); }).catch(()=>{}); }catch(e){} }

/* เรียก Edge Function */
function pay(body){
  const ctl = new AbortController(), t = setTimeout(()=>ctl.abort(), 20000);
  return fetch(PAY_URL, {
    method:'POST', signal: ctl.signal,
    headers:{ 'Content-Type':'application/json', apikey: EX_SB.key },
    body: JSON.stringify(Object.assign({ token: exToken() }, body))
  }).then(r=>r.json()).finally(()=>clearTimeout(t));
}

/* ---------- หน้าเลือกจำนวนเงิน ---------- */
function renderInfo(){
  $('#hint').textContent = `ຂັ້ນຕ່ຳ ${fmt(CONFIG.minAmount)} • ສູງສຸດ ${fmt(CONFIG.maxAmount)}`;
  const S = [
    'ໃສ່ຈຳນວນເງິນທີ່ຕ້ອງການເຕີມ ແລ້ວກົດ "ສ້າງ QR Code"',
    'ເປີດແອັບທະນາຄານຂອງທ່ານ ເລືອກສະແກນ QR ແລ້ວໂອນຕາມຍອດທີ່ສະແດງ',
    'ຍອດເງິນຈະເຂົ້າບັນຊີຂອງທ່ານໂດຍອັດຕະໂນມັດ ບໍ່ຕ້ອງແນບສະລິບ ກະລຸນາຢ່າປິດໜ້ານີ້ຈົນກວ່າຈະສຳເລັດ'
  ];
  $('#steps').innerHTML = S.map((t,i)=>`<li><i>${i+1}</i><span>${t}</span></li>`).join('');
}
function renderChips(){
  $('#chips').innerHTML = CONFIG.amounts.map(a=>`<button class="chip${a===amount?' on':''}" data-a="${a}" type="button">${short(a)}</button>`).join('');
}
function syncInput(){ $('#amt').value = amount ? amount.toLocaleString('en-US') : ''; }
$('#chips').addEventListener('click', e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  amount = +c.dataset.a; syncInput(); renderChips();
});
$('#amt').addEventListener('input', e=>{
  const n = parseInt(e.target.value.replace(/[^\d]/g,''),10) || 0;
  amount = Math.min(n, 999999999); syncInput(); renderChips();
});

/* ---------- สลับหน้า (เบลอ) ---------- */
function swap(from, to, cb){
  from.classList.add('blur-out');
  setTimeout(()=>{
    from.classList.add('hide'); from.classList.remove('blur-out');
    to.classList.remove('hide'); to.classList.add('blur-in');
    window.scrollTo(0,0);
    requestAnimationFrame(()=>requestAnimationFrame(()=>to.classList.remove('blur-in')));
    cb && cb();
  }, 480);
}

/* ---------- แสดง QR ---------- */
function drawQR(url){
  const box = $('#qrbox');
  const ph = '<div class="qrph"><svg viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3m4-3v.01M14 21h.01M17 21h4v-4"/></svg><span>ກຳລັງໂຫຼດ QR...</span></div>';
  box.innerHTML = ph;
  if(!url) return;
  const img = new Image(); img.alt = 'QR';
  img.onload = ()=>{ box.innerHTML=''; box.appendChild(img); };
  img.onerror = ()=>{ box.innerHTML = '<div class="qrph"><span>ໂຫຼດ QR ບໍ່ສຳເລັດ<br>ກະລຸນາກັບຄືນ ແລ້ວສ້າງໃໝ່</span></div>'; };
  img.src = url;
}
function ringSet(f){
  const p=$('#pg'); p.style.strokeDasharray = '1 1'; p.style.strokeDashoffset = (1-f);
  p.style.opacity = f <= 0.003 ? 0 : 1;
}
function mmss(s){ s=Math.max(0,Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }

function showQR(req, animate){
  $('#qAmt').textContent = fmt(req.amount);
  $('#iAmt').textContent = fmt(req.amount);
  drawQR(req.qr_url);
  const go = ()=>{ startTick(req); startPoll(req); };
  if(animate) swap($('#vPick'), $('#vQR'), go);
  else { $('#vPick').classList.add('hide'); $('#vQR').classList.remove('hide'); go(); }
}

function startTick(req){
  clearInterval(tickT);
  const run = ()=>{
    const total = req.exp ? Math.max(30, (req.exp - req.at) / 1000) : CONFIG.qrSeconds;
    const end = req.exp || (req.at + CONFIG.qrSeconds * 1000);
    const el = (Date.now() - req.at) / 1000;
    const left = Math.max(0, (end - Date.now()) / 1000);
    ringSet(Math.min(1, left / total));
    $('#cdn').textContent = mmss(left);
    const low = left <= 30;
    $('#cd').classList.toggle('low', low);
    document.querySelector('.ring').classList.toggle('low', low);
    $('#cdLbl').textContent = left > 0 ? 'ເຫຼືອເວລາ' : 'ກຳລັງກວດສອບການໂອນ...';
    if(Date.now() > end + CONFIG.graceSeconds * 1000){ finish('expired'); }
  };
  run(); tickT = setInterval(run, 250);
}

/* ---------- โพลสถานะทุก 3 วินาที ---------- */
function startPoll(req){
  stopPoll();
  const tick = ()=>{
    if(polling || cur !== req) return;
    polling = true;
    pay({ action:'check', id: req.id }).then(j=>{
      if(cur !== req) return;
      if(j && j.ok){
        if(j.status === 'paid') finish('paid', j);
        else if(j.status === 'expired') finish('expired');
        else if(j.expires_at && !req.exp){ req.exp = j.expires_at * 1000; store.set(PEND, req); }
      } else if(j && j.code === 'bad_session'){ finish('session'); }
    }).catch(()=>{}).finally(()=>{ polling = false; });
  };
  pollT = setInterval(tick, CONFIG.pollMs); tick();
}
function stopPoll(){ clearInterval(pollT); pollT = null; polling = false; }

function backToPick(msg){
  clearInterval(tickT); stopPoll(); cur = null; store.del(PEND);
  const vq = $('#vQR');
  if(vq.classList.contains('hide')){ if(msg) toast(msg); return; }
  swap(vq, $('#vPick'), ()=>{ if(msg) toast(msg); });
}

function finish(kind, j){
  if(!cur) return;
  const req = cur;
  clearInterval(tickT); stopPoll(); cur = null; store.del(PEND);
  if(kind === 'paid'){
    const n = Number(j.amount) || req.amount;
    saveBal(j.balance);
    if(window.ExLog) ExLog.addTopup(n, 'laoqr');
    $('#waitCard').innerHTML = `<div class="ok"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
      <h3>ເຕີມເງິນສຳເລັດ</h3><div class="big">+${fmt(n)}</div><p>ຍອດເງິນຄົງເຫຼືອ ${fmt(balance)}</p>
      <button class="go" id="okBtn" type="button" style="margin-top:18px">ຕົກລົງ</button>`;
    $('#ovWait').classList.add('show');
    $('#okBtn').onclick = ()=>location.reload();
  } else if(kind === 'session'){
    exClearLocal(); exNeedLogin('topup.html');
  } else {
    backToPick('QR ໝົດອາຍຸແລ້ວ ກະລຸນາສ້າງ QR ໃໝ່');
  }
}

/* ---------- สร้าง QR ---------- */
function startQR(){
  if(busy) return;
  if(amount < CONFIG.minAmount){ toast('ຂັ້ນຕ່ຳ ' + fmt(CONFIG.minAmount)); return; }
  if(amount > CONFIG.maxAmount){ toast('ສູງສຸດ ' + fmt(CONFIG.maxAmount)); return; }
  busy = true; const btn = $('#goBtn'); btn.style.opacity = .6;
  pay({ action:'create', amount })
    .then(j=>{
      if(j && j.ok){
        const req = { id: j.id, amount: j.amount || amount, qr_url: j.qr_url || '', at: Date.now(), exp: j.expires_at ? j.expires_at * 1000 : 0 };
        cur = req; store.set(PEND, req); showQR(req, true); return;
      }
      const c = j && j.code;
      toast(c==='bad_session' ? 'ເຊດຊັນໝົດອາຍຸ ກະລຸນາເຂົ້າສູ່ລະບົບໃໝ່'
          : c==='sale_closed' ? 'ຮ້ານຍັງບໍ່ເປີດຂາຍ ຫຼື ປິດຊົ່ວຄາວ ເຕີມເງິນບໍ່ໄດ້'
          : c==='too_many' ? 'ມີລາຍການລໍຖ້າຢູ່ຫຼາຍເກີນໄປ ກະລຸນາລອງໃໝ່ພາຍຫຼັງ'
          : c==='amount' ? 'ຈຳນວນເງິນບໍ່ຖືກຕ້ອງ' : 'ສ້າງ QR ບໍ່ສຳເລັດ ກະລຸນາລອງໃໝ່');
      if(c==='bad_session'){ exClearLocal(); setTimeout(()=>exNeedLogin('topup.html'), 900); }
    })
    .catch(()=>toast('ເຊື່ອມຕໍ່ເຊີບເວີບໍ່ໄດ້ ກະລຸນາກວດອິນເຕີເນັດແລ້ວລອງໃໝ່'))
    .finally(()=>{ busy = false; btn.style.opacity = ''; });
}
$('#goBtn').onclick = startQR;
$('#qBack').onclick = ()=>backToPick();

/* ---------- เริ่มต้น ---------- */
setBal(); syncBal(); renderInfo(); renderChips(); syncInput(); ringSet(1);
/* ถ้ารีโหลดหน้าระหว่างรอจ่าย (เช่น สลับไปแอปธนาคาร) → กลับมาที่ QR เดิมและโพลต่อ */
(function resume(){
  const p = store.get(PEND, null);
  if(p && p.id && p.at && Date.now() < (p.exp || p.at + CONFIG.qrSeconds * 1000) + CONFIG.graceSeconds * 1000){
    cur = p; showQR(p, false);
  } else store.del(PEND);
})();
</script>
<script src="notify.js"></script>
</body>
</html>
